# Render Infrastructure-as-Code Blueprint
services:
  # 1. FastAPI Backend (Docker Web Service)
  - type: web
    name: rag-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    disk:
      name: rag-storage
      mountPath: /app/uploads
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rag-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://rag-frontend.onrender.com,http://localhost:5173

  # 2. Vite React Frontend (Static Site)
  - type: web
    name: rag-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://rag-backend.onrender.com/api
      - key: VITE_BACKEND_URL
        value: https://rag-backend.onrender.com

databases:
  # 3. Managed PostgreSQL Database
  - name: rag-postgres
    databaseName: rag_db
    user: rag_db_user
    plan: free
